services:
  db:
    image: postgres:16-alpine
    container_name: slotbook-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slotbook_test
      POSTGRES_USER: slotbook_test_app
      POSTGRES_PASSWORD: ${SLOTBOOK_TEST_DB_PASSWORD:?Run npm run db:test:env to create the ignored test environment file}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - slotbook_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  slotbook_test_postgres_data:
    name: slotbook_test_postgres_data
